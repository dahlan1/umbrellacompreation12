<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Umbrella Corporation - Contact</title>
    <style>
        @font-face {
            font-family: 'Umbrella';
            src: url('https://fonts.cdnfonts.com/css/umbrella-academy') format('woff2');
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?ixlib=rb-1.2.1&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            position: relative;
            min-height: 100vh;
        }

        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 0;
            border-bottom: 1px solid #e63946;
        }

        .logo {
            font-family: 'Umbrella', sans-serif;
            font-size: 2.5rem;
            color: #e63946;
            text-shadow: 0 0 10px rgba(230, 57, 70, 0.5);
        }

        .sound-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s;
        }

        .sound-btn:hover {
            background: #f1faee;
            color: #e63946;
        }

        main {
            padding: 40px 0;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 30px;
            color: #e63946;
            text-align: center;
        }

        .contact-form {
            background: rgba(30, 30, 30, 0.9);
            padding: 30px;
            border-radius: 10px;
            max-width: 800px;
            margin: 0 auto;
            box-shadow: 0 0 20px rgba(230, 57, 70, 0.3);
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #e63946;
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #444;
            border-radius: 5px;
            background: rgba(50, 50, 50, 0.8);
            color: white;
            font-size: 1rem;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: #e63946;
        }

        textarea {
            min-height: 150px;
            resize: vertical;
        }

        .submit-btn {
            background: #e63946;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            transition: all 0.3s;
            display: block;
            margin: 30px auto 0;
            width: 200px;
        }

        .submit-btn:hover {
            background: #f1faee;
            color: #e63946;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 20px 0;
            border-top: 1px solid #e63946;
            margin-top: 40px;
            color: #aaa;
            font-size: 0.9rem;
        }

        .hidden {
            display: none;
        }

        .success-message {
            text-align: center;
            padding: 20px;
            background: rgba(46, 125, 50, 0.8);
            border-radius: 5px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .logo {
                font-size: 1.8rem;
            }
            
            h1 {
                font-size: 2rem;
            }
            
            .contact-form {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <a href="index.html">Home</a>
    <div class="container">
        <header>
            <div class="logo">UMBRELLA CORPORATION</div>
            <button id="soundToggle" class="sound-btn">Sound OFF</button>
        </header>

        <main>
            <h1>CONTACT US</h1>
            
            <div id="successMessage" class="success-message hidden">
                Your message has been received. A representative will contact you shortly.
            </div>
            
            <form id="contactForm" class="contact-form">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required>
                </div>
                
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>
                
                <div class="form-group">
                    <label for="department">Department</label>
                    <select id="department" name="department" required>
                        <option value="">Select a department</option>
                        <option value="research">Research and Development</option>
                        <option value="security">Security Division</option>
                        <option value="hr">Human Resources</option>
                        <option value="executive">Executive Office</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="subject">Subject</label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                
                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" required></textarea>
                </div>
                
                <button type="submit" class="submit-btn">SUBMIT</button>
            </form>
        </main>
        
        <footer>
            &copy; 2023 Umbrella Corporation. All rights reserved. "Our Business Is Life Itself"
        </footer>
    </div>

    <audio id="bgAudio" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
    </audio>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const audio = document.getElementById('bgAudio');
            const soundToggle = document.getElementById('soundToggle');
            const contactForm = document.getElementById('contactForm');
            const successMessage = document.getElementById('successMessage');
            
            let isSoundOn = false;
            
            // Sound toggle functionality
            soundToggle.addEventListener('click', function() {
                isSoundOn = !isSoundOn;
                
                if (isSoundOn) {
                    audio.play();
                    soundToggle.textContent = 'Sound ON';
                } else {
                    audio.pause();
                    soundToggle.textContent = 'Sound OFF';
                }
            });
            
            // Form submission
            contactForm.addEventListener('submit', function(e) {
                e.preventDefault();
                
                // In a real implementation, this would send to the backend
                const formData = new FormData(contactForm);
                const data = Object.fromEntries(formData.entries());
                
                // Simulate form submission
                console.log('Form submitted:', data);
                
                // Here you would typically send the data to your Python backend
                // For this demo, we'll just show the success message
                contactForm.classList.add('hidden');
                successMessage.classList.remove('hidden');
                
                // Reset form after 5 seconds (for demo purposes)
                setTimeout(() => {
                    contactForm.reset();
                    contactForm.classList.remove('hidden');
                    successMessage.classList.add('hidden');
                }, 5000);
            });
        });
// Form submission
contactForm.addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Get form data
    const formData = new FormData(contactForm);
    
    // Send to backend
    fetch('/api/contact', {
        method: 'POST',
        body: new URLSearchParams(formData),
        headers: {
            'Content-Type': 'application/x-www-form-urlencoded'
        }
    })
    .then(response => response.json())
    .then(data => {
        if (data.status === 'success') {
            // Show success message
            contactForm.classList.add('hidden');
            successMessage.classList.remove('hidden');
            
            // Reset form after 5 seconds
            setTimeout(() => {
                contactForm.reset();
                contactForm.classList.remove('hidden');
                successMessage.classList.add('hidden');
            }, 5000);
        } else {
            alert('There was an error submitting your form. Please try again.');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        alert('There was an error submitting your form. Please try again.');
    });
});
    </script>
</body>
</html>
